<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asemic Vein</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="pen-float" aria-label="Asemic Vein">
      <div class="float-head">
        <h1>Asemic Vein</h1>
        <button
          type="button"
          class="icon"
          id="pen-float-toggle"
          aria-expanded="true"
        >
          收合
        </button>
      </div>
      <div class="float-body">
        <h2>造型路徑</h2>
        <div class="layout-slides">
          <label class="slide">
            <span>grid</span>
            <input
              id="lab-grid"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
            <span class="val" id="lab-grid-v">1.00</span>
          </label>
          <label class="slide">
            <span>concentric</span>
            <input
              id="lab-conc"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <span class="val" id="lab-conc-v">0.00</span>
          </label>
          <label class="slide">
            <span>barcode</span>
            <input
              id="lab-bar"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <span class="val" id="lab-bar-v">0.00</span>
          </label>
          <label class="slide">
            <span>branch</span>
            <input
              id="lab-branch"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <span class="val" id="lab-branch-v">0.00</span>
          </label>
          <label class="slide">
            <span>stars</span>
            <input
              id="lab-star"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <span class="val" id="lab-star-v">0.00</span>
          </label>
        </div>
        <div class="togs">
          <label class="tog">
            <input id="lab-nonlinear" type="checkbox" />
            非線性
          </label>
          <div class="togs vein-path-row">
            <label class="tog">
              <input id="lab-path" type="checkbox" />
              顯示造型路徑
            </label>
            <div class="vein-path-actions">
              <button type="button" class="icon" id="lab-copy" title="複製參數 JSON">
                複製
              </button>
              <button type="button" class="icon" id="lab-load" title="載入參數 JSON">
                Load
              </button>
            </div>
            <input
              id="lab-load-json"
              type="file"
              accept="application/json,.json"
              hidden
            />
          </div>
          <label class="tog">
            <input id="lab-brush" type="checkbox" checked />
            顯示筆刷
          </label>
        </div>
        <div class="lab">
          <label class="share">
            <span>線</span>
            <input
              id="lab-leaf-share"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.5"
            />
            <span>葉子</span>
          </label>
          <p class="share-read">
            線 <span id="lab-share-line">50%</span>
            · 葉 <span id="lab-share-leaf">50%</span>
            · <span class="val" id="lab-leaf-share-v">0.50</span>
          </p>
          <label class="slide">
            <span>補線缺口</span>
            <input
              id="lab-gap-fill"
              type="range"
              min="2"
              max="60"
              step="1"
              value="30"
            />
            <span class="val" id="lab-gap-fill-v">30</span>
          </label>
          <label class="slide">
            <span>葉子長度</span>
            <input
              id="lab-leaf-len"
              type="range"
              min="0.05"
              max="5"
              step="0.05"
              value="1"
            />
            <span class="val" id="lab-leaf-len-v">1.00</span>
          </label>
          <label class="slide">
            <span>葉子寬度</span>
            <input
              id="lab-leaf-wid"
              type="range"
              min="1"
              max="3"
              step="0.05"
              value="1"
            />
            <span class="val" id="lab-leaf-wid-v">1.00</span>
          </label>
          <label class="slide">
            <span>葉子密度</span>
            <input
              id="lab-leaf-dens"
              type="range"
              min="1"
              max="2"
              step="0.05"
              value="1"
            />
            <span class="val" id="lab-leaf-dens-v">1.00</span>
          </label>
          <label class="slide">
            <span>葉子線寬</span>
            <input
              id="lab-leaf-sw"
              type="range"
              min="0.5"
              max="6"
              step="0.05"
              value="1"
            />
            <span class="val" id="lab-leaf-sw-v">1.00</span>
          </label>
          <label class="slide">
            <span>直線線寬</span>
            <input
              id="lab-line-sw"
              type="range"
              min="0.5"
              max="6"
              step="0.05"
              value="1"
            />
            <span class="val" id="lab-line-sw-v">1.00</span>
          </label>
          <label class="share vein-mode">
            <span>曲線</span>
            <input
              id="lab-leaf-tri"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <span>三角</span>
          </label>
          <label class="share vein-mode">
            <span>葉緣</span>
            <input
              id="lab-leaf-vein"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <span>葉脈</span>
          </label>
          <label class="share vein-mode">
            <span>內</span>
            <input
              id="lab-leaf-off"
              type="range"
              min="-1"
              max="1"
              step="0.01"
              value="0"
            />
            <span>外</span>
          </label>
          <p class="share-read">
            葉子離路徑
            <span class="val" id="lab-leaf-off-v">0.00</span>
            （−1 往內 · 0 貼邊 · 1 往外）
          </p>
          <label class="share vein-mode">
            <span>接上</span>
            <input
              id="lab-leaf-pad"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
            <span>留空</span>
          </label>
        </div>
        <label class="row-check">
          <input id="lab-rand-path" type="checkbox" />
          <span>每條路徑不同參數</span>
        </label>
        <label class="row-check">
          <input id="lab-pencil" type="checkbox" />
          <span>鉛筆質感</span>
        </label>
        <label class="row-check">
          <input id="lab-white" type="checkbox" checked />
          <span>白色</span>
        </label>
        <label class="row-check">
          <input id="lab-live" type="checkbox" checked />
          <span>即時</span>
        </label>
        <div class="run-row">
          <button type="button" class="gen" id="lab-reseed">新種子</button>
        </div>
      </div>
    </aside>
    <script src="mix-vein.js?v=sw25"></script>
    <script src="sketch2.js?v=sw73"></script>
  </body>
</html>
